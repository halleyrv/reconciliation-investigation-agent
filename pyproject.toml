[project]
name = "reconciliation-investigation-agent"
version = "0.0.0"
description = "Workspace root: shared tooling for every package in this repository"
requires-python = ">=3.14,<3.15"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["simulator", "backend"]

[tool.uv.sources]
simulator = { workspace = true }
recon = { workspace = true }

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "import-linter>=2.16",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "recon",
    "ruff>=0.17.4",
    "simulator",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["recon"]

[tool.mypy]
strict = true
files = ["simulator/src", "simulator/tests", "backend/src", "backend/tests"]

[tool.pytest.ini_options]
testpaths = ["simulator/tests", "backend/tests"]
addopts = ["--strict-markers"]

[tool.importlinter]
root_packages = ["simulator", "recon"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Simulator is independent of the backend, LangGraph and LLM SDKs"
type = "forbidden"
source_modules = ["simulator"]
forbidden_modules = [
    "recon",
    "langgraph",
    "langchain",
    "langchain_core",
    "langchain_anthropic",
    "langchain_openai",
    "anthropic",
    "openai",
    "google",
    "mistralai",
    "litellm",
]

[[tool.importlinter.contracts]]
name = "Ingestion layers: adapters > api > application > domain"
type = "layers"
containers = ["recon.ingestion"]
layers = ["adapters", "api", "application", "domain"]

[[tool.importlinter.contracts]]
name = "Reconciliation layers: adapters > api > application > domain"
type = "layers"
containers = ["recon.reconciliation"]
layers = ["adapters", "api", "application", "domain"]

[[tool.importlinter.contracts]]
name = "Contexts integrate only through each other's api module"
type = "forbidden"
source_modules = ["recon.reconciliation"]
forbidden_modules = ["recon.ingestion.domain", "recon.ingestion.application", "recon.ingestion.adapters"]

[[tool.importlinter.contracts]]
name = "Ingestion does not depend on downstream contexts"
type = "forbidden"
source_modules = ["recon.ingestion"]
forbidden_modules = ["recon.reconciliation"]

[[tool.importlinter.contracts]]
name = "Domain and shared kernel use only the stdlib and the shared kernel"
type = "forbidden"
source_modules = ["recon.*.domain", "recon.shared_kernel"]
forbidden_modules = [
    "recon.bootstrap",
    "recon.ingestion.application",
    "recon.ingestion.adapters",
    "recon.ingestion.api",
    "recon.reconciliation.application",
    "recon.reconciliation.adapters",
    "recon.reconciliation.api",
    "alembic",
    "fastapi",
    "psycopg",
    "pydantic",
    "sqlalchemy",
    "starlette",
]
