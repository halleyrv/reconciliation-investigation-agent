[project]
name = "reconciliation-investigation-agent"
version = "0.0.0"
description = "Workspace root: shared tooling for every package in this repository"
requires-python = ">=3.14,<3.15"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["simulator"]

[tool.uv.sources]
simulator = { workspace = true }

[dependency-groups]
dev = [
    "import-linter>=2.16",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "simulator",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["simulator/src", "simulator/tests"]

[tool.pytest.ini_options]
testpaths = ["simulator/tests"]
addopts = ["--strict-markers"]

[tool.importlinter]
root_packages = ["simulator"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Simulator is independent of the backend, LangGraph and LLM SDKs"
type = "forbidden"
source_modules = ["simulator"]
forbidden_modules = ["recon", "langgraph", "langchain", "langchain_core", "anthropic", "openai"]
