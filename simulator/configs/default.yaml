# Default run: 200 orders, about 15% of them affected by anomalies.
# Money and rates are quoted decimal strings: YAML floats are rejected.
orders: 200
period:
  start: "2026-10-01"
  end: "2026-10-31"
currency: USD
gateways:
  gateway_a:
    percentage_bps: 290
    fixed_fee: "0.30"
  gateway_b:
    percentage_bps: 250
    fixed_fee: "0.25"
settlement_lag_business_days: 2
refund_rate: "0.08"
anomaly_rates:
  duplicate_payment: "0.01"
  unauthorized_refund: "0.01"
  incorrect_fee: "0.01"
  missing_transaction: "0.015"
  partial_payment: "0.01"
  delayed_settlement: "0.01"
  incorrect_amount: "0.01"
  inconsistent_reference: "0.01"
  out_of_order_event: "0.01"
  duplicate_refund: "0.01"
  conflicting_resent_record: "0.01"
