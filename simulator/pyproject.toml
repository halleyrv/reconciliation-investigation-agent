[project]
name = "simulator"
version = "0.1.0"
description = "Financial Data Simulator: reproducible synthetic datasets with ground truth"
requires-python = ">=3.14,<3.15"
dependencies = [
    "faker>=40.44.0",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
simulate = "simulator.cli:main"
simulate-verify = "simulator.cli:verify_main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
